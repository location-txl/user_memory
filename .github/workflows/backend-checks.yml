name: 后端回归

on: pull_request

permissions:
  contents: read

jobs:
  backend:
    name: 后端检查
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 获取代码
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 设置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: 设置 pnpm
        uses: pnpm/action-setup@v6
      - name: 设置 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 类型检查
        run: pnpm typecheck
      - name: TypeScript 测试
        run: pnpm test
      - name: Hermes 测试
        run: pnpm test:hermes
