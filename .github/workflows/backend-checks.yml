name: 后端回归

on:
  pull_request:
    paths-ignore:
      - README.md
      - "docs/**"
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - "docs/**"

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('backend-pr-{0}', github.event.pull_request.number) || format('backend-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: ${{ github.event_name == 'pull_request' && '后端检查' || format('后端检查 ({0})', matrix.commit) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 一次 push 可能带多个提交，每个提交都单独跑回归。
        commit: ${{ github.event_name == 'push' && github.event.commits.*.id || fromJSON(format('["{0}"]', github.sha)) }}
    steps:
      - name: 获取代码
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.commit }}
          persist-credentials: false
      - name: 设置 pnpm
        run: |
          mkdir -p "$RUNNER_TEMP/pnpm-bin"
          corepack enable --install-directory "$RUNNER_TEMP/pnpm-bin" pnpm
          echo "$RUNNER_TEMP/pnpm-bin" >> "$GITHUB_PATH"
      - name: 设置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: 安装依赖
        run: |
          # better-sqlite3 冷启动编译时使用已安装的同版本 Node.js 头文件。
          export npm_config_nodedir="$(dirname "$(dirname "$(command -v node)")")"
          pnpm install --frozen-lockfile
      - name: 类型检查
        run: pnpm typecheck
      - name: TypeScript 测试
        run: pnpm test
      - name: Hermes 测试
        run: pnpm test:hermes
